{% load race_labels %}<section class="panel countdown-panel" data-countdown="{{ event.date|date:'c' }}" data-server-now="{{ server_now }}"><div><p class="eyebrow">PRÓXIMO EVENTO</p><h2><a href="{% url 'event' event.id %}">{{ event.name }}</a></h2><p>{{ event.date|date:'d M Y · H:i' }} · {{ event.location }}</p><small data-countdown-status role="status">Cuenta regresiva al inicio programado</small></div><div class="countdown-clock" aria-label="Tiempo para el evento"><div><strong data-time="days">—</strong><span>DÍAS</span></div><div><strong data-time="hours">—</strong><span>HORAS</span></div><div><strong data-time="minutes">—</strong><span>MIN</span></div><div><strong data-time="seconds">—</strong><span>SEG</span></div></div></section>
