<section class="event-schedule" id="event-dates" aria-labelledby="event-schedule-title">
  <h3 id="event-schedule-title">Fechas y horarios</h3>
  <p>Día/mes/año y hora de Ciudad de México.</p>
  <div class="event-schedule-groups">
    <fieldset><legend>Periodo de inscripciones</legend><div class="form-grid">
      <label>Apertura de inscripciones {{ policy_form.registration_start }}<small>Opcional. Si queda vacía, abre al publicar el evento.</small>{{ policy_form.registration_start.errors }}</label>
      <label>Cierre de inscripciones {{ form.registration_end }}{{ form.registration_end.errors }}</label>
    </div></fieldset>
    <fieldset><legend>Celebración del evento</legend><div class="form-grid">
      <label>Inicio del evento {{ form.date }}{{ form.date.errors }}</label>
      <label>Fin del evento {{ policy_form.event_end }}<small>Opcional. Hora prevista de finalización.</small>{{ policy_form.event_end.errors }}</label>
    </div></fieldset>
  </div>
</section>
