<div class="duel-player {% if match.winner_id == entry.pk %}is-winner{% endif %}">{% if entry.participant.photo %}<img src="{{ entry.participant.photo.url }}" alt="" class="playoff-avatar">{% endif %}<span class="playoff-bib">#{{ entry.bib }}</span><h3>{{ entry.name }}</h3><strong class="duel-score">{{ score }}</strong>
{% if match.winner_id == entry.pk %}<span class="playoff-status">Ganador</span>{% endif %}
{% if capture and round.editable and not match.winner_id %}<form method="post">{% csrf_token %}<input type="hidden" name="round" value="{{ round.pk }}"><input type="hidden" name="match" value="{{ match.pk }}"><input type="hidden" name="revision" value="{{ match.revision }}"><input type="hidden" name="winner" value="{{ entry.pk }}"><button class="button secondary" name="action" value="victory">+ Victoria</button></form>{% endif %}</div>
