{% load race_labels %}<div class="availability" data-availability-url="{% url 'event_availability' event.id %}"><div class="seat-line"><strong><span data-seat="remaining">{{ seats.remaining }}</span> lugares disponibles</strong><span>Cupo: <span data-seat="capacity">{{ seats.capacity }}</span></span></div><div class="progress"><span data-seat-progress style="width:{% if seats.capacity %}{% widthratio seats.occupied seats.capacity 100 %}{% else %}0{% endif %}%"></span></div><div class="seat-breakdown"><span><b data-seat="confirmed">{{ seats.confirmed }}</b> confirmados</span></div><small data-seat-feedback>{% if seats.full %}Cupo agotado.{% elif not seats.registration_open %}{{ event.registration_label }}.{% else %}Inscripción en mostrador con pago en efectivo.{% endif %}</small></div>
