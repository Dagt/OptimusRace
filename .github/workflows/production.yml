name: Production checks
on: [push, pull_request]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: optimus
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: optimus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U optimus -d optimus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOAD_DOTENV: "0"
      DEBUG: "1"
      SECRET_KEY: ci-only-secret-not-for-production-01234567890123456789012345
      DATABASE_URL: postgres://optimus:test-only-password@localhost:5432/optimus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-production.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: node --test tests/*.test.cjs
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "0"
          PUBLIC_URL: https://ci.example.test
          MEDIA_STORAGE: r2
          R2_ENDPOINT_URL: https://ci.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ci-test-only
          R2_SECRET_ACCESS_KEY: ci-test-only
          R2_BUCKET_NAME: ci-test-only
          TRUST_PROXY_SSL: "1"
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t optimus-production-check .
